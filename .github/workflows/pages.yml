name: Deploy gallery to GitHub Pages

# Publishes docs/ (the live WebGL lesson gallery + thumbnails + markdown docs).
# No manual setup needed: configure-pages runs with `enablement: true`, so the first
# run switches the repository's Pages source to "GitHub Actions" by itself. Leaving it
# on the default "Deploy from a branch" source would serve a Jekyll rendering of the
# root README instead of the gallery, and every docs/ asset would 404.
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deployments instead of cancelling: a cancelled actions/deploy-pages run can
# leave the Pages deployment stuck until the next successful one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true creates the Pages site (or moves it to workflow builds) using
      # the `pages: write` permission above, so a fork gets a working gallery with no
      # clicks in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
