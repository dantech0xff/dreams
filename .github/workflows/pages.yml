name: Deploy gallery to GitHub Pages

# Publishes docs/ (the live WebGL lesson gallery + thumbnails + markdown docs).
# `enablement: true` only auto-creates a Pages site that doesn't exist yet — it does
# NOT switch an existing site away from "Deploy from a branch". If the repo's Pages
# source is left on the legacy branch build, every push to master triggers a Jekyll
# build that serves the root README and races this deployment; the repo-root
# index.html + .nojekyll redirect to docs/ covers that case. For the canonical fix,
# set Settings → Pages → Source to "GitHub Actions".
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deployments instead of cancelling: a cancelled actions/deploy-pages run can
# leave the Pages deployment stuck until the next successful one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true creates the Pages site using the `pages: write` permission
      # above, so a fork gets a working gallery with no clicks in Settings. It does
      # not override an existing "Deploy from a branch" source.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
