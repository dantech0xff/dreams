<!DOCTYPE html>
<!-- Root fallback for when GitHub Pages is on "Deploy from a branch" instead of
     "GitHub Actions": the legacy build serves the repo root, so redirect to the
     real gallery in docs/. Harmless under Actions deploys, which upload docs/ only. -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=docs/">
    <script>location.replace('docs/' + location.search + location.hash);</script>
    <link rel="canonical" href="docs/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dreams — AGSL gallery</title>
  </head>
  <body>
    <p>Redirecting to the <a href="docs/">Dreams AGSL gallery</a>…</p>
  </body>
</html>
